[package]
name = "microscope-current-bundle-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
mollusk-svm = { path = "../../cache/native-full-bundle/mollusk/harness", features = ["all-builtins", "precompiles", "invocation-inspect-callback"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
solana-account = "3.4.0"
solana-instruction = "3.3.0"
solana-pubkey = "4.1.0"
solana-sdk-ids = "3.1.0"
solana-svm-log-collector = { version = "4.0.0", features = ["agave-unstable-api"] }
solana-program-runtime = { version = "4.0.0", features = ["agave-unstable-api"] }
solana-transaction-context = { version = "4.0.0", features = ["agave-unstable-api"] }
